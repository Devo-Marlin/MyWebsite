<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Devon Marlin</title>
<meta name="description" content="Devon Marlin — projects, builds, and models." />
<meta property="og:title" content="Devon Marlin" />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#861f41" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/site.css?v=202611090j" />
<script>
  try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script src="config.js?v=202611090j"></script>
</head>
<body>

<a class="skip" href="#ring">Skip to models</a>

<header class="corner">
  <a class="mark" href="#top" aria-label="Devon Marlin">DM</a>
  <button class="icon-btn" id="theme" type="button" aria-label="Toggle light and dark theme">
    <svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/>
    </svg>
    <svg class="moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20.5 14.3A8.6 8.6 0 0 1 9.7 3.5 8.6 8.6 0 1 0 20.5 14.3z"/>
    </svg>
  </button>
</header>

<main id="top">

  <section class="hero" aria-label="Devon Marlin">
    <h1 class="name"><span>Devon</span><span>Marlin</span></h1>
    <span class="rule" aria-hidden="true"></span>
    <a class="cue" href="#ring" aria-label="Scroll to models"><span></span></a>
    <p class="nogl" hidden>The 3D view isn't available on this device or browser.</p>
  </section>

  <section class="ring-wrap" id="ring" aria-label="Projects">
    <div class="stage" id="stage">
      <canvas id="gl"></canvas>
      <div class="progress" id="progress" aria-hidden="true"></div>
      <div class="labels" id="labels"></div>

      <div class="hud" id="hud" hidden>
        <button class="icon-btn close" id="close" type="button" aria-label="Back to all projects">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
        <div class="hud-title" id="hud-title"></div>
        <label class="explode" id="explode-wrap">
          <span>Explode</span>
          <input type="range" id="explode" min="0" max="1.15" step="0.001" value="0" aria-label="Exploded view amount" />
        </label>
        <button class="pill" id="open-drawer" type="button" hidden>Photos</button>
      </div>
    </div>
    <ul class="vh" id="project-list"></ul>
  </section>

</main>

<footer class="foot">
  <span id="foot-links"></span>
  <button class="lock" id="lock" type="button" aria-label="Admin sign in">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
  </button>
</footer>

<section class="sheet" id="sheet" aria-hidden="true" aria-label="Part details">
  <div class="sheet-scroll" id="sheet-scroll">
    <div class="sheet-window" aria-hidden="true"><span class="sheet-cue">Scroll</span></div>
    <article class="sheet-body">
      <header class="sheet-head">
        <span class="sheet-kicker" id="sheet-kicker"></span>
        <h2 id="sheet-title"></h2>
        <div class="chips" id="sheet-chips"></div>
      </header>
      <div id="sheet-cad"></div>
      <div id="sheet-blocks"></div>
      <div class="sheet-tools" id="sheet-tools" hidden>
        <div class="sheet-add" id="sheet-add"></div>
        <div class="sheet-save">
          <button class="pill solid" id="sheet-save" type="button">Save page</button>
          <span class="status" id="sheet-status" role="status"></span>
        </div>
      </div>
    </article>
  </div>
  <button class="pill sheet-back" id="sheet-back" type="button">&larr; Assembly</button>
</section>

<div class="tip" id="tip" role="tooltip" hidden></div>

<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Project details">
  <div class="drawer-head">
    <div>
      <div class="drawer-title" id="drawer-title"></div>
      <input class="field" id="drawer-title-input" type="text" hidden aria-label="Project title" />
    </div>
    <button class="icon-btn" id="drawer-close" type="button" aria-label="Close details">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
  </div>
  <p class="drawer-notes" id="drawer-notes"></p>
  <textarea class="field" id="drawer-notes-input" rows="5" hidden aria-label="Project notes" placeholder="Notes"></textarea>
  <div class="photos" id="photos"></div>
  <div class="admin-tools" id="admin-tools" hidden>
    <label class="pill">
      Add photos
      <input type="file" id="photo-input" accept="image/*" multiple hidden />
    </label>
    <button class="pill solid" id="save" type="button">Save</button>
    <span class="status" id="status" role="status"></span>
  </div>
</aside>

<div class="lightbox" id="lightbox" hidden><img alt="" /></div>

<div class="adminbar" id="adminbar" hidden>
  <span>Admin</span>
  <button type="button" id="signout">Sign out</button>
</div>

<dialog class="login" id="login">
  <form method="dialog" id="login-form">
    <div class="login-title">Admin</div>
    <p class="login-note" id="login-note" hidden></p>
    <label>Username<input class="field" id="login-user" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required /></label>
    <label>Password
      <span class="pw">
        <input class="field" id="login-pass" type="password" autocomplete="current-password" required />
        <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password" aria-pressed="false">
          <svg class="eye" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17.7 17.7 0 0 1-3.2 4.2M6.6 6.6C3.7 8.3 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
        </button>
      </span>
    </label>
    <p class="login-err" id="login-err" role="alert"></p>
    <div class="login-row">
      <button type="button" class="pill" id="login-cancel">Cancel</button>
      <button type="submit" class="pill solid">Sign in</button>
    </div>
  </form>
</dialog>

<script type="module" src="js/main.js?v=202611090j"></script>
</body>
</html>
